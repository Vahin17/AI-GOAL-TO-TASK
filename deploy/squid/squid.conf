# ==============================================================================
# ARDO Playwright Browser Egress Proxy Configuration (Squid)
# ==============================================================================
# Enforces an independent network-level egress boundary for Playwright browser workers.
# Blocks private RFC 1918 networks, loopback, link-local, and cloud metadata APIs.
# ==============================================================================

# Listening port for browser worker proxy requests
http_port 3128

# Blocked Destination Networks (Private, Loopback, Link-Local, Cloud Metadata)
acl current_net dst 0.0.0.0/8
acl private_class_a dst 10.0.0.0/8
acl cgnat_net dst 100.64.0.0/10
acl private_class_b dst 172.16.0.0/12
acl private_class_c dst 192.168.0.0/16
acl loopback_net dst 127.0.0.0/8
acl link_local_net dst 169.254.0.0/16
acl benchmark_net dst 198.18.0.0/15
acl cloud_metadata dst 169.254.169.254/32
acl ipv6_loopback dst ::1/128
acl ipv6_local dst fe80::/10
acl ipv6_private dst fc00::/7
acl ipv6_v4_mapped dst ::ffff:0:0/96

# Permitted Outbound Ports (Web traffic only)
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl SSL_ports port 443          # https

# Rule 1: Deny requests to non-standard ports
http_access deny !Safe_ports

# Rule 2: Deny CONNECT requests to non-SSL ports
http_access deny CONNECT !SSL_ports

# Rule 3: Deny all egress requests targeting internal/private/metadata destinations
http_access deny cloud_metadata
http_access deny link_local_net
http_access deny loopback_net
http_access deny current_net
http_access deny private_class_a
http_access deny cgnat_net
http_access deny private_class_b
http_access deny private_class_c
http_access deny benchmark_net
http_access deny ipv6_loopback
http_access deny ipv6_local
http_access deny ipv6_private
http_access deny ipv6_v4_mapped

# Rule 4: Allow legitimate external public web requests from authorized internal network
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
http_access allow localnet

# Default deny all other requests
http_access deny all

# Privacy & Security Header Masking (Do not leak internal client IPs to upstream servers)
forwarded_for off
request_header_access Via deny all
request_header_access X-Forwarded-For deny all

# Logging
access_log /var/log/squid/access.log squid
logfile_rotate 10

